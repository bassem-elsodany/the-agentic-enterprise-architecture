<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840">
<title>Three places a step of an assistant can sit</title>
<defs><linearGradient id="scale" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#1E293B"/><stop offset="0.38" stop-color="#1E293B"/><stop offset="0.5" stop-color="#0F766E"/><stop offset="0.62" stop-color="#0F766E"/><stop offset="1" stop-color="#B45309"/></linearGradient></defs>
<rect width="1600" height="840" fill="#FAF6EF"/>
<text x="80" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="bold" font-style="normal" fill="#1C1917" text-anchor="start">Three places a step can sit</text>
<text x="80" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="normal" font-style="italic" fill="#57534E" text-anchor="start">Ask the same questions of every step, whatever framework draws the graph.</text>
<text x="120" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#1E293B" text-anchor="start" letter-spacing="1.6">THE MODEL CHOOSES THE PATH</text>
<text x="800" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#0F766E" text-anchor="middle" letter-spacing="1.6">PEOPLE WROTE THE PATH</text>
<text x="1480" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#B45309" text-anchor="end" letter-spacing="1.6">A PERSON DOES THE WORK</text>
<rect x="120" y="250" width="1360" height="14" rx="7" fill="url(#scale)"/>
<circle cx="300" cy="257" r="33" fill="#FAF6EF" stroke="#1E293B" stroke-width="5"/>
<text x="300" y="269" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="bold" font-style="normal" fill="#1E293B" text-anchor="middle">1</text>
<rect x="95" y="328" width="410" height="4" fill="#1E293B"/>
<text x="95" y="376" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="bold" font-style="normal" fill="#1E293B" text-anchor="start">A model-led step</text>
<text x="95" y="416" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#57534E" text-anchor="start" letter-spacing="1.6">THE TEST</text>
<text x="95" y="442" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1C1917" text-anchor="start">It changes nothing and sends nothing, and a</text>
<text x="95" y="464" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1C1917" text-anchor="start">person sees the result before anything is</text>
<text x="95" y="486" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1C1917" text-anchor="start">changed.</text>
<rect x="95" y="530" width="3" height="68" fill="#1D4ED8"/>
<text x="111" y="548" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#1D4ED8" text-anchor="start" letter-spacing="1.4">IN THE HEALTH NETWORK</text>
<text x="111" y="572" font-family="Georgia, 'Times New Roman', serif" font-size="16.5" font-weight="normal" font-style="italic" fill="#57534E" text-anchor="start">Finding Anna a doctor by symptom. She reads</text>
<text x="111" y="594" font-family="Georgia, 'Times New Roman', serif" font-size="16.5" font-weight="normal" font-style="italic" fill="#57534E" text-anchor="start">the list and chooses.</text>
<circle cx="800" cy="257" r="33" fill="#FAF6EF" stroke="#0F766E" stroke-width="5"/>
<text x="800" y="269" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="bold" font-style="normal" fill="#0F766E" text-anchor="middle">2</text>
<rect x="595" y="328" width="410" height="4" fill="#0F766E"/>
<text x="595" y="376" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="bold" font-style="normal" fill="#0F766E" text-anchor="start">A written step</text>
<text x="595" y="416" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#57534E" text-anchor="start" letter-spacing="1.6">THE TEST</text>
<text x="595" y="442" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1C1917" text-anchor="start">It changes a record or sends something out, or</text>
<text x="595" y="464" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1C1917" text-anchor="start">nobody sees its result first. People write the</text>
<text x="595" y="486" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1C1917" text-anchor="start">steps, test them and sign them off.</text>
<rect x="595" y="530" width="3" height="68" fill="#1D4ED8"/>
<text x="611" y="548" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#1D4ED8" text-anchor="start" letter-spacing="1.4">IN THE HEALTH NETWORK</text>
<text x="611" y="572" font-family="Georgia, 'Times New Roman', serif" font-size="16.5" font-weight="normal" font-style="italic" fill="#57534E" text-anchor="start">Moving Anna&#x27;s appointment, then e-mailing</text>
<text x="611" y="594" font-family="Georgia, 'Times New Roman', serif" font-size="16.5" font-weight="normal" font-style="italic" fill="#57534E" text-anchor="start">her the confirmation.</text>
<rect x="595" y="624" width="3" height="68" fill="#1D4ED8"/>
<text x="611" y="642" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#1D4ED8" text-anchor="start" letter-spacing="1.4">IN THE HEALTH NETWORK</text>
<text x="611" y="666" font-family="Georgia, 'Times New Roman', serif" font-size="16.5" font-weight="normal" font-style="italic" fill="#57534E" text-anchor="start">A note Anna leaves on her appointment, read</text>
<text x="611" y="688" font-family="Georgia, 'Times New Roman', serif" font-size="16.5" font-weight="normal" font-style="italic" fill="#57534E" text-anchor="start">later by Dr Rao&#x27;s assistant.</text>
<circle cx="1300" cy="257" r="33" fill="#FAF6EF" stroke="#B45309" stroke-width="5"/>
<text x="1300" y="269" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="bold" font-style="normal" fill="#B45309" text-anchor="middle">3</text>
<rect x="1095" y="328" width="410" height="4" fill="#B45309"/>
<text x="1095" y="376" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="bold" font-style="normal" fill="#B45309" text-anchor="start">Work a person does for now</text>
<text x="1095" y="416" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#57534E" text-anchor="start" letter-spacing="1.6">THE TEST</text>
<text x="1095" y="442" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1C1917" text-anchor="start">It changes a record, and the steps cannot be</text>
<text x="1095" y="464" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1C1917" text-anchor="start">written down yet. A person does the work until</text>
<text x="1095" y="486" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1C1917" text-anchor="start">they can.</text>
<rect x="1095" y="530" width="3" height="68" fill="#1D4ED8"/>
<text x="1111" y="548" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#1D4ED8" text-anchor="start" letter-spacing="1.4">IN THE HEALTH NETWORK</text>
<text x="1111" y="572" font-family="Georgia, 'Times New Roman', serif" font-size="16.5" font-weight="normal" font-style="italic" fill="#57534E" text-anchor="start">Updating a medication list from a free-text</text>
<text x="1111" y="594" font-family="Georgia, 'Times New Roman', serif" font-size="16.5" font-weight="normal" font-style="italic" fill="#57534E" text-anchor="start">request, with no agreed steps.</text>
<rect x="80" y="726" width="1440" height="2" fill="#1C1917"/>
<text x="800" y="774" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" font-style="normal" fill="#1C1917" text-anchor="middle">A step that changes a record is never left to the model.</text>
<text x="800" y="808" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="normal" font-style="italic" fill="#57534E" text-anchor="middle">The model can ask for it. A written step makes it.</text>
</svg>